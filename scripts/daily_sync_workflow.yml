name: NICHEPULSE Daily Automated Sync & Deploy

on:
  schedule:
    # Exécution automatique quotidienne à 04:00 UTC
    - cron: '0 4 * * *'
  workflow_dispatch: # Permet le déclenchement manuel depuis GitHub Actions

jobs:
  sync-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-play-scraper httpx fastapi uvicorn sqlalchemy apscheduler pydantic-settings python-dotenv

      - name: 🔄 Verify & Refresh 200 Store Apps Telemetry
        run: |
          python scripts/resolve_all_store_apps.py
          python scripts/apply_final_verified_fixes.py

      - name: 🚀 Start local backend & Export Telemetry for Cloudflare
        run: |
          cd backend
          python -m uvicorn main:app --port 8000 &
          sleep 4
          cd ..
          python scripts/export_for_cloudflare.py

      - name: 🟢 Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: 📦 Install Node dependencies & Build Next.js
        run: |
          cd frontend
          npm ci
          npm run build

      - name: ⚡ Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy frontend/out --project-name=nichepulse --commit-dirty=true

      - name: 💾 Commit & Push updated telemetry
        run: |
          git config --global user.name "nichepulse-bot[bot]"
          git config --global user.email "nichepulse-bot@users.noreply.github.com"
          git add backend/nichepulse.db frontend/public/data/telemetry_bundle.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(telemetry): automated daily market sync [skip ci]" && git push)
